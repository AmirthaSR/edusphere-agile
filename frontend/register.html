<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — EduSphere</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1f2d45;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(59,130,246,0.08);
      animation: fadeUp 0.5s ease;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      text-align: center;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1a2235;
      color: var(--text);
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

<div class="container">
  <div class="card">

    <h1>Edu<span>Sphere</span></h1>
    <div class="subtitle">Smart Learning Platform</div>

    <h2>Create Account</h2>

    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Email Address" required>
    <input type="password" placeholder="Password" required>

    <button>Register</button>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>

  </div>
</div>

</body>
</html>
