<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — EduSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0e1a; --surface: #111827; --border: #1f2d45;
      --accent: #3b82f6; --accent2: #06b6d4;
      --text: #e2e8f0; --muted: #64748b;
      --danger: #ef4444; --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 32px; width: 100%; max-width: 420px;
      box-shadow: 0 0 40px rgba(59,130,246,0.08); animation: fadeUp 0.5s ease;
    }
    h1 { font-family: 'Syne', sans-serif; text-align: center; font-size: 1.6rem; font-weight: 800; }
    h1 span { color: var(--accent); }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; margin-top: 4px; }
    h2 { text-align: center; margin-bottom: 20px; font-size: 1.2rem; }
    input {
      width: 100%; padding: 12px; margin-bottom: 14px;
      border-radius: 10px; border: 1px solid var(--border);
      background: #1a2235; color: var(--text); font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: white; font-weight: 600; cursor: pointer; margin-top: 6px;
      font-size: 0.95rem; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #message { text-align: center; margin-top: 12px; font-size: 0.85rem; }
    .error { color: var(--danger); }
    .success { color: var(--success); }
    .footer { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Edu<span>Sphere</span></h1>
  <div class="subtitle">Smart Learning Platform</div>
  <h2>Create Account</h2>
  <input type="text"     id="name"     placeholder="Your Name" />
  <input type="email"    id="email"    placeholder="Email Address" />
  <input type="password" id="password" placeholder="Password" />
  <button id="regBtn" onclick="register()">Register</button>
  <p id="message"></p>
  <div class="footer">Already have an account? <a href="login.html">Login</a></div>
</div>

<script>
const BASE_URL = "https://edusphere-api-func-f7c4fbgxgncweafs.centralindia-01.azurewebsites.net/api";

async function register() {
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const msg      = document.getElementById('message');
  const btn      = document.getElementById('regBtn');

  if (!name || !email || !password) {
    msg.className = 'error';
    msg.textContent = 'All fields are required.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';
  msg.textContent = '';

  try {
    const res = await fetch(`${BASE_URL}/registerUser`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      msg.className = 'success';
      msg.textContent = 'Account created! Redirecting to login…';
      setTimeout(() => window.location.href = 'login.html', 1200);
    } else {
      msg.className = 'error';
      msg.textContent = data.error || 'Registration failed.';
      btn.disabled = false;
      btn.textContent = 'Register';
    }
  } catch (err) {
    msg.className = 'error';
    msg.textContent = 'Could not reach server. Try again.';
    btn.disabled = false;
    btn.textContent = 'Register';
  }
}
</script>
</body>
</html>
