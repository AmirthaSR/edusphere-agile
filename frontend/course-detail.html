<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduSphere — Course Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0e1a; --surface: #111827; --surface2: #1a2235;
      --border: #1f2d45; --accent: #3b82f6; --accent2: #06b6d4;
      --gold: #f59e0b; --success: #10b981; --danger: #ef4444;
      --text: #e2e8f0; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none; z-index: 0;
    }

    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 230px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 20px; z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 40px; }
    .logo span { color: var(--accent); }
    .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 0.875rem; font-weight: 500; transition: all 0.2s; border: 1px solid transparent; text-decoration: none; }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--accent); background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.2); }
    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 20px; }
    .logout-btn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 0.875rem; transition: all 0.2s; border: none; background: none; width: 100%; font-family: inherit; }
    .logout-btn:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

    .main { margin-left: 230px; padding: 32px 36px; position: relative; z-index: 1; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.875rem; cursor: pointer; margin-bottom: 24px; transition: color 0.2s; background: none; border: none; font-family: inherit; }
    .back-btn:hover { color: var(--text); }

    .course-header { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 24px; animation: fadeUp 0.5s ease both; }
    .course-icon-lg { width: 72px; height: 72px; border-radius: 16px; background: rgba(59,130,246,0.15); display: flex; align-items: center; justify-content: center; font-size: 2rem; flex-shrink: 0; }
    .course-header-info { flex: 1; }
    .course-header-info h1 { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .course-header-info p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .course-meta-chips { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .chip { font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--surface2); }
    .chip.accent { background: rgba(59,130,246,0.1); color: var(--accent); border-color: rgba(59,130,246,0.25); }
    .overall-progress { margin-top: 20px; }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1s ease; }

    .course-video { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
    .course-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    .enroll-btn { margin-top: 16px; padding: 10px 24px; border-radius: 10px; border: none; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: white; font-weight: 600; cursor: pointer; font-size: 0.875rem; font-family: inherit; transition: opacity 0.2s; }
    .enroll-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .lessons-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; animation: fadeUp 0.5s 0.15s ease both; }
    .lessons-panel h2 { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 20px; }

    .lesson-item { border-radius: 14px; background: var(--surface2); border: 1px solid transparent; margin-bottom: 14px; overflow: hidden; transition: border-color 0.2s; }
    .lesson-item:hover { border-color: var(--border); }
    .lesson-item.completed { border-color: rgba(16,185,129,0.3); }

    .lesson-row { display: flex; align-items: center; gap: 16px; padding: 16px; cursor: pointer; }
    .lesson-number { width: 36px; height: 36px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .lesson-item.completed .lesson-number { background: rgba(16,185,129,0.15); color: var(--success); }
    .lesson-info { flex: 1; }
    .lesson-title { font-size: 0.9rem; font-weight: 500; color: var(--text); }
    .lesson-content { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .lesson-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .video-chip { font-size: 0.7rem; padding: 3px 9px; border-radius: 20px; background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }
    .lesson-action { padding: 7px 16px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: all 0.2s; }
    .lesson-action.start { background: rgba(59,130,246,0.15); color: var(--accent); }
    .lesson-action.start:hover { background: rgba(59,130,246,0.25); }
    .lesson-action.done { background: rgba(16,185,129,0.15); color: var(--success); }

    .video-panel { display: none; padding: 0 16px 16px; }
    .video-panel.open { display: block; }
    .video-embed { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 10px; overflow: hidden; background: #000; }
    .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .video-placeholder { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; height: 180px; background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 0.82rem; }
    .video-placeholder span { font-size: 1.8rem; }

    .loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--muted); font-size: 0.875rem; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .toast { position: fixed; bottom: 30px; right: 30px; background: var(--success); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 0.875rem; font-weight: 500; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 20px; } .course-header { flex-direction: column; } }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Edu<span>Sphere</span></div>
  <nav class="nav">
    <a class="nav-item" href="dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a class="nav-item active" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Courses
    </a>
  
    <a class="nav-item" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Users
    </a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="handleLogout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log Out
    </button>
  </div>
</aside>

<main class="main">
  <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
  <div class="course-header" id="courseHeader">
    <div class="loading-state"><div class="spinner"></div> Loading course…</div>
  </div>
  <div class="lessons-panel">
    <h2>📋 Lessons</h2>
    <div id="lessonsList">
      <div class="loading-state"><div class="spinner"></div> Fetching lessons…</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const BASE_URL = "https://edusphere-api-func-f7c4fbgxgncweafs.centralindia-01.azurewebsites.net/api";
  const params   = new URLSearchParams(window.location.search);
  const courseId = params.get('courseId') || 1;

  function getUserId() {
    const raw  = sessionStorage.getItem('user') || localStorage.getItem('user');
    const user = raw ? JSON.parse(raw) : null;
    return user ? user.user_id || user.id || 1 : 1;
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === 'error' ? 'var(--danger)' : 'var(--success)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function handleLogout() {
    sessionStorage.clear();
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  function toYouTubeEmbed(url) {
    if (!url) return null;
    if (url.includes('youtube.com/embed/')) return url;
    const shortMatch = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
    if (shortMatch) return `https://www.youtube.com/embed/${shortMatch[1]}`;
    const longMatch = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
    if (longMatch) return `https://www.youtube.com/embed/${longMatch[1]}`;
    if (url.startsWith('http')) return url;
    return null;
  }

  function toggleVideo(lessonId) {
    const panel = document.getElementById(`vid-${lessonId}`);
    if (!panel) return;
    panel.classList.toggle('open');
  }

  async function enrollInCourse(userId, courseId, btn) {
    btn.disabled = true;
    btn.textContent = 'Enrolling…';
    try {
      const res = await fetch(`${BASE_URL}/enrollCourse`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, courseId })
      });
      const data = await res.json();
      if (res.status === 409) {
        showToast('ℹ️ Already enrolled!');
        btn.textContent = '✓ Enrolled';
        btn.style.background = 'rgba(16,185,129,0.15)';
        btn.style.color = 'var(--success)';
        return;
      }
      if (!res.ok) throw new Error(data.error || 'Enroll failed');
      btn.textContent = '✓ Enrolled';
      btn.style.background = 'rgba(16,185,129,0.15)';
      btn.style.color = 'var(--success)';
      showToast('🎉 Successfully enrolled!');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Enroll Now';
      showToast('❌ Could not enroll. Try again.', 'error');
    }
  }

  async function markComplete(userId, courseId, lessonId, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`${BASE_URL}/updateProgress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, courseId, lessonId })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      btn.textContent = '✓ Done';
      btn.className = 'lesson-action done';
      const item = btn.closest('.lesson-item');
      item.classList.add('completed');
      item.querySelector('.lesson-number').textContent = '✓';
      const fill  = document.getElementById('progressFill');
      const label = document.getElementById('progressLabel');
      if (fill && data.progress !== undefined) {
        fill.style.width  = data.progress + '%';
        label.textContent = data.progress + '% complete';
      }
      showToast('✅ Lesson marked as complete!');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Mark Done';
      showToast('❌ Could not update progress.', 'error');
    }
  }

  async function loadCourseDetail() {
    try {
      const userId = getUserId();
      const res    = await fetch(`${BASE_URL}/getCourseDetails?courseId=${courseId}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data    = await res.json();
      const course  = data.course;
      const lessons = data.lessons || [];

      let completedLessonIds = [];
      try {
        const statsRes  = await fetch(`${BASE_URL}/getUserStats?userId=${userId}`);
        const statsData = await statsRes.json();
        completedLessonIds = statsData.completedLessonIds || [];
      } catch (_) {}

      const completedCount = completedLessonIds.length;
      const progressPct    = lessons.length > 0 ? Math.round((completedCount / lessons.length) * 100) : 0;
      const embedUrl       = toYouTubeEmbed(course.video_url);

      document.getElementById('courseHeader').innerHTML = `
        <div class="course-icon-lg">📚</div>
        <div class="course-header-info">
          <h1>${course.title}</h1>
          <p>${course.description}</p>
          <div class="course-meta-chips">
            <span class="chip accent">${lessons.length} Lessons</span>
            <span class="chip">Self-paced</span>
            <span class="chip">Certificate on completion</span>
          </div>
          <div class="overall-progress">
            <div class="progress-header">
              <span>Overall Progress</span>
              <span id="progressLabel">${progressPct}% complete</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill" style="width:${progressPct}%"></div>
            </div>
          </div>
          ${embedUrl ? `
          <div class="course-video" style="margin-top:20px;">
            <iframe src="${embedUrl}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen loading="lazy">
            </iframe>
          </div>` : ''}
          <button class="enroll-btn" onclick="enrollInCourse(${userId}, ${courseId}, this)">
            Enroll Now
          </button>
        </div>
      `;

      const list = document.getElementById('lessonsList');
      if (lessons.length === 0) {
        list.innerHTML = '<div class="loading-state">No lessons found for this course.</div>';
        return;
      }

      list.innerHTML = lessons.map((lesson, i) => {
        const isDone     = completedLessonIds.includes(lesson.lesson_id);
        const lessonEmbed = toYouTubeEmbed(lesson.video_url);
        const hasVideo   = !!lessonEmbed;

        const videoPanel = hasVideo
          ? `<div class="video-panel" id="vid-${lesson.lesson_id}">
               <div class="video-embed">
                 <iframe src="${lessonEmbed}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
               </div>
             </div>`
          : `<div class="video-panel" id="vid-${lesson.lesson_id}">
               <div class="video-placeholder"><span>🎬</span>No video assigned yet</div>
             </div>`;

        return `
          <div class="lesson-item ${isDone ? 'completed' : ''}" id="lesson-${lesson.lesson_id}">
            <div class="lesson-row" onclick="toggleVideo(${lesson.lesson_id})">
              <div class="lesson-number">${isDone ? '✓' : i + 1}</div>
              <div class="lesson-info">
                <div class="lesson-title">${lesson.title}</div>
                <div class="lesson-content">${lesson.content}</div>
              </div>
              <div class="lesson-meta">
                ${hasVideo ? '<span class="video-chip">▶ Video</span>' : ''}
                <button
                  class="lesson-action ${isDone ? 'done' : 'start'}"
                  ${isDone ? 'disabled' : ''}
                  onclick="event.stopPropagation(); markComplete(${userId}, ${courseId}, ${lesson.lesson_id}, this)">
                  ${isDone ? '✓ Done' : 'Mark Done'}
                </button>
              </div>
            </div>
            ${videoPanel}
          </div>`;
      }).join('');

    } catch (err) {
      document.getElementById('courseHeader').innerHTML =
        `<div class="loading-state">❌ Could not load course. <a href="dashboard.html" style="color:var(--accent);margin-left:8px">Go back</a></div>`;
      document.getElementById('lessonsList').innerHTML = '';
    }
  }

  loadCourseDetail();
</script>
</body>
</html>
